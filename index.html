<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>红包</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #ff5a5a 0%, #e02424 55%, #b31217 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: #fffdf5;
    border-radius: 20px;
    padding: 40px 28px 36px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    position: relative;
    z-index: 2;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    color: #d81e06;
    margin-bottom: 6px;
  }
  .sub {
    font-size: 13px;
    color: #999;
    margin-bottom: 28px;
  }

  .envelope {
    width: 150px;
    height: 150px;
    margin: 0 auto 30px;
    position: relative;
    transition: transform .3s;
  }
  .envelope .pocket {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #ff6b6b, #e02424);
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(224,36,36,.45);
  }
  .envelope .flap {
    position: absolute;
    top: 0; left: 0; right: 0; height: 70px;
    background: linear-gradient(180deg, #ff8a8a, #e02424);
    border-radius: 16px 16px 50% 50% / 16px 16px 90% 90%;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition: transform .5s ease;
  }
  .envelope .circle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 54px; height: 54px;
    background: #ffd54a;
    border: 3px solid #fff;
    border-radius: 50%;
    color: #b8860b;
    font-size: 30px;
    font-weight: 900;
    line-height: 48px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }
  .envelope.open .flap { transform: rotateX(180deg); }

  .btn {
    display: inline-block;
    width: 100%;
    padding: 18px 0;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(160deg, #ff7a3d, #ff4d2e);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(255,77,46,.45);
    transition: transform .1s;
  }
  .btn:active { transform: scale(.94); }
  .btn.bump { animation: bump .35s ease; }
  @keyframes bump {
    0% { transform: scale(1); }
    35% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .hint {
    margin-top: 18px;
    font-size: 14px;
    color: #666;
    min-height: 20px;
  }
  .hint b { color: #d81e06; font-size: 16px; }

  /* 揭晓结果 */
  .result {
    display: none;
    margin-top: 8px;
  }
  .result .big {
    font-size: 44px;
    font-weight: 900;
    color: #d81e06;
    letter-spacing: 4px;
    animation: pop .5s ease;
  }
  @keyframes pop {
    0% { transform: scale(.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .result .joke {
    margin-top: 14px;
    font-size: 14px;
    color: #999;
  }

  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: #bbb;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">🧧 红包</div>
    <div class="sub">连点 5 下，即可提现</div>

    <div class="envelope" id="envelope">
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="circle">开</div>
    </div>

    <button class="btn" id="btn">🧧 提现红包</button>
    <div class="hint" id="hint">还差 <b>5</b> 下</div>

    <div class="result" id="result">
      <div class="big">恭喜你提现成功五十元<!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
      </head>
      <body>
        
      </body>
      </html></div>
      <div class="joke">🎉 下次再见拜拜咯</div>
    </div>

    <div class="footer">奶娃赞助</div>
  </div>

<script>
  const total = 5;
  let count = 0;
  const btn = document.getElementById('btn');
  const hint = document.getElementById('hint');
  const envelope = document.getElementById('envelope');
  const result = document.getElementById('result');
  const flap = envelope.querySelector('.flap');

  btn.addEventListener('click', () => {
    if (count >= total) return;
    count++;
    btn.classList.remove('bump');
    void btn.offsetWidth; // 重触发动画
    btn.classList.add('bump');

    const left = total - count;
    if (left > 0) {
      hint.innerHTML = '还差 <b>' + left + '</b> 下';
    } else {
      hint.innerHTML = '';
      btn.style.display = 'none';
      envelope.classList.add('open');
      result.style.display = 'block';
    }
  });
</script>
</body>
</html>
